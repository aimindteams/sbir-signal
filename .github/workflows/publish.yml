name: Publish or skip draft

on:
  issues:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: sbir-signal
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'sbir-draft')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Find the draft date
        id: draft
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          date=$(printf '%s' "$BODY" | grep -oE 'drafts/[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d/ -f2)
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Publish (closed as completed)
        if: github.event.issue.state_reason == 'completed' && steps.draft.outputs.date != ''
        env:
          SUBSTACK_URL: ${{ vars.SUBSTACK_URL }}
        run: python -m sbir_signal.publish --date "${{ steps.draft.outputs.date }}"

      - name: Skip (closed as not planned)
        if: github.event.issue.state_reason != 'completed' && steps.draft.outputs.date != ''
        run: python -m sbir_signal.publish --discard "${{ steps.draft.outputs.date }}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs drafts data
          git diff --cached --quiet || git commit -m "Publish ${{ steps.draft.outputs.date }}"
          git push
